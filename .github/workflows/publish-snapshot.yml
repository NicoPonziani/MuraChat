name: Publish Snapshot

on:
  push:
    branches: [ main ]

jobs:
  publish:
    name: Deploy snapshot to GitHub Packages
    runs-on: ubuntu-latest

    # Only run when the version is a SNAPSHOT — avoids accidental release deploys.
    if: contains(github.event.head_commit.message, '[deploy]') || endsWith(github.ref, '/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 with GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check version is a SNAPSHOT
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            echo "Not a SNAPSHOT version — skipping deployment."
            exit 0
          fi

      - name: Build and deploy
        run: mvn --batch-mode clean deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

